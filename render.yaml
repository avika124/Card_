services:
  - type: web
    name: complyline-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.vercel.app
      - key: DATA_DIR
        value: /var/data
      - key: MODEL
        value: claude-sonnet-4-6
      - key: MAX_TOKENS
        value: "8000"
    disk:
      name: complyline-data
      mountPath: /var/data
      sizeGB: 1
