<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rounded square bg -->
  <rect x="0" y="0" width="200" height="200" rx="40" fill="#1C2D4F"/>
  <!-- Top teal sweep -->
  <path d="M0 0 L0 80 L100 30 L200 80 L200 0 Z" fill="#2A9D8F" rx="40" opacity="0.9"/>
  <rect x="0" y="0" width="200" height="200" rx="40" fill="none" stroke="#2A9D8F" stroke-width="3" opacity="0.3"/>

  <!-- Scale — large centered -->
  <line x1="44" y1="105" x2="156" y2="105" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="58" x2="100" y2="155" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="58" r="9" fill="#E9C46A"/>
  <circle cx="100" cy="58" r="5" fill="#1C2D4F"/>

  <!-- Left pan -->
  <line x1="44" y1="105" x2="44" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="3.5"/>
  <path d="M24 126 Q44 118 64 126" stroke="rgba(255,255,255,0.7)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Right pan -->
  <line x1="156" y1="105" x2="156" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="3.5"/>
  <path d="M136 126 Q156 118 176 126" stroke="rgba(255,255,255,0.7)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Circuit nodes on beam -->
  <circle cx="64" cy="105" r="7" fill="#2A9D8F"/>
  <circle cx="80" cy="105" r="4.5" fill="#2A9D8F" opacity="0.55"/>
  <circle cx="120" cy="105" r="4.5" fill="#2A9D8F" opacity="0.55"/>
  <circle cx="136" cy="105" r="7" fill="#2A9D8F"/>

  <!-- Pan data tiles -->
  <rect x="30" y="132" width="12" height="12" rx="2.5" fill="#E9C46A"/>
  <rect x="46" y="132" width="12" height="12" rx="2.5" fill="#2A9D8F"/>
  <rect x="142" y="132" width="12" height="12" rx="2.5" fill="#2A9D8F"/>
  <rect x="158" y="132" width="12" height="12" rx="2.5" fill="#E9C46A"/>

  <!-- "CL" monogram bottom -->
  <text x="100" y="182"
        font-family="Georgia, serif" font-size="18" font-weight="700"
        fill="rgba(214,228,247,0.5)" text-anchor="middle" letter-spacing="4">CL</text>
</svg>