<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Shield background -->
  <path d="M8 10 L8 50 Q8 68 24 73 L40 78 L56 73 Q72 68 72 50 L72 10 Z"
        fill="#1C2D4F"/>
  <!-- Teal top accent -->
  <path d="M8 10 L8 28 L40 12 L72 28 L72 10 Z"
        fill="#2A9D8F" opacity="0.92"/>

  <!-- Scale beam -->
  <line x1="18" y1="40" x2="62" y2="40" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Center post -->
  <line x1="40" y1="22" x2="40" y2="62" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pivot -->
  <circle cx="40" cy="22" r="3.5" fill="#E9C46A"/>

  <!-- Left arm -->
  <line x1="18" y1="40" x2="18" y2="51" stroke="#D6E4F7" stroke-width="1.6"/>
  <path d="M10 51 Q18 47 26 51" stroke="#D6E4F7" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Right arm -->
  <line x1="62" y1="40" x2="62" y2="51" stroke="#D6E4F7" stroke-width="1.6"/>
  <path d="M54 51 Q62 47 70 51" stroke="#D6E4F7" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Circuit dots -->
  <circle cx="26" cy="40" r="2.8" fill="#2A9D8F"/>
  <circle cx="33" cy="40" r="1.8" fill="#2A9D8F" opacity="0.55"/>
  <circle cx="47" cy="40" r="1.8" fill="#2A9D8F" opacity="0.55"/>
  <circle cx="54" cy="40" r="2.8" fill="#2A9D8F"/>

  <!-- Pan data squares -->
  <rect x="13" y="53" width="5" height="5" rx="1" fill="#E9C46A"/>
  <rect x="20" y="53" width="5" height="5" rx="1" fill="#2A9D8F"/>
  <rect x="55" y="53" width="5" height="5" rx="1" fill="#2A9D8F"/>
  <rect x="62" y="53" width="5" height="5" rx="1" fill="#E9C46A"/>
</svg>